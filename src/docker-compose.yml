# Case Converter for TerraMaster TOS 7 (Docker application)
#
# Upstream project : https://github.com/caseconverter/caseconverter (MIT)
#   The static production web page is embedded in this compose file, so the
#   application ships its own content: the ONLY thing pulled from the network
#   at install time is the nginx container image from Docker Hub. The app then
#   runs fully offline.
#
# Why the content is embedded instead of downloaded at run time:
#   A TOS Docker package may contain exactly four files (config.ini, <appid>.lang,
#   <appid>.svg, docker-compose.yml) and the image must come from Docker Hub.
#   Downloading the web page at first start would make the app depend on GitHub
#   or a CDN being reachable from inside the container, which is not reliable
#   (GitHub is unreachable over IPv4 on many NAS networks, including the one
#   this app was validated on). Embedding the ~48 KB site therefore gives a
#   self-contained, deterministic, offline application.
#
#   The web page is carried inside this file as the base64 of a deterministic
#   tar.gz (the SITE_B64 environment variable below). `scripts/build.sh`
#   regenerates it from the human-readable `site/` directory. A reviewer can
#   inspect the payload with:
#       tar xzOf caseconvert.tar.gz docker-compose.yml \
#         | sed -n '/SITE_B64: |-/,/END embedded site payload/p' \
#         | sed '1d;$d' | tr -d ' \t' | base64 -d | tar tzf -
#   (or use scripts/unpack-site.sh <package.tar.gz> [outdir])
#
# TOS rules honoured here:
#   * Docker Hub image only, fixed tag (never :latest)
#   * container_name == application id, restart: unless-stopped
#   * non-root user via the user field, no privileged mode, no host network
#   * persistent data under /Volume*/DockerAppData/caseconvert/
#   * explicit TZ, healthcheck on the only service
#   * no hardcoded credentials
#   * x-app-meta is the last block of this file

services:
  caseconvert:
    # nginxinc/nginx-unprivileged is the official nginx image for non-root use
    # (it listens on 8080 and runs as an unprivileged user). Fixed tag.
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: caseconvert
    restart: unless-stopped
    # TOS policy: containers must run as a non-root user
    user: "1000:1000"
    environment:
      # explicit timezone (TOS requirement; change to your local zone if needed)
      TZ: Asia/Shanghai
      # base64(gzip(tar(site/*))) - the Case Converter web page (see header).
      # Regenerated by scripts/build.sh; do not edit by hand.
      # --- BEGIN embedded site payload ---
      SITE_B64: |-
        @@SITE_B64@@
      # --- END embedded site payload ---
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        # The extracted site is served from the NAS data directory when the
        # platform makes it writable (so it survives restarts), otherwise from
        # /tmp. Both work; the content is identical either way.
        WORK=/tmp/site
        DATA=/data
        if mkdir -p "$$DATA/site" 2>/dev/null && touch "$$DATA/.w" 2>/dev/null; then
          rm -f "$$DATA/.w"
          WORK="$$DATA/site"
        fi
        rm -rf "$$WORK"
        mkdir -p "$$WORK"
        printf '%s' "$$SITE_B64" | base64 -d | tar -xzf - -C "$$WORK"
        test -s "$$WORK/index.html"
        # The image's default docroot (/usr/share/nginx/html) is root-owned and
        # not writable by uid 1000, so we serve the extracted files with a small
        # self-contained config written to /tmp (world-writable in the image).
        cat > /tmp/nginx.conf <<'NGINX'
        worker_processes auto;
        pid /tmp/nginx.pid;
        error_log /dev/stderr warn;
        events { worker_connections 1024; }
        http {
          include /etc/nginx/mime.types;
          default_type application/octet-stream;
          server_tokens off;
          access_log off;
          client_body_temp_path /tmp/client_body;
          proxy_temp_path /tmp/proxy;
          fastcgi_temp_path /tmp/fastcgi;
          uwsgi_temp_path /tmp/uwsgi;
          scgi_temp_path /tmp/scgi;
          server {
            listen 8080;
            server_name _;
            root __WORK__;
            index index.html;
            location / { try_files $$uri $$uri/ =404; }
          }
        }
        NGINX
        sed -i "s#__WORK__#$$WORK#" /tmp/nginx.conf
        exec nginx -c /tmp/nginx.conf -g 'daemon off;'
    ports:
      # host:container - host port in the TOS-recommended 8000-19999 range
      - "8910:8080"
    volumes:
      # whole app data directory: holds the extracted web files (and nothing
      # else). Safe to delete to reset the app.
      - /Volume*/DockerAppData/caseconvert/data:/data
    healthcheck:
      # nginx answers as soon as the site has been extracted
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# TOS App Center web metadata (must be the last block of the file)
x-app-meta:
  web:
    port: 8910
    protocol: http
